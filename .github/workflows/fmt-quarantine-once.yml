name: fmt-quarantine-once
on:
  push:
    branches:
      - fix/quarantine-dlq-retry-contract
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.38'
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write test/integration/sqs-localstack.spec.ts
      - name: Emit formatted source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'test/integration/sqs-localstack.spec.ts';
          console.log('__FORMATTED_FILE__' + JSON.stringify({path, content: fs.readFileSync(path, 'utf8')}));
          NODE
