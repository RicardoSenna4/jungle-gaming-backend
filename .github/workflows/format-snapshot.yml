name: format-snapshot
on:
  push:
    branches:
      - fix/challenge-final-remediation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.38'
      - run: bun install --frozen-lockfile
      - name: Format source in a disposable runner
        run: bun run format
      - name: Emit formatted source for authenticated repository synchronization
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const paths = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim();
          for (const path of paths.split('\n').filter(Boolean)) {
            console.log('__FORMATTED_FILE__' + JSON.stringify({
              path, content: fs.readFileSync(path, 'utf8')
            }));
          }
          NODE
