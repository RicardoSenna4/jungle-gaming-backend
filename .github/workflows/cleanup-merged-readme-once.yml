name: cleanup-merged-readme-branch-once
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'RicardoSenna4/jungle-gaming-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Delete docs branch only when fully merged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="docs/readme-project-standard"
          echo "Checking that origin/main contains all commits from $branch..."
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')"
          if [ "$ahead" != "0" ]; then
            echo "::error::Refusing deletion: $ahead unmerged commit(s)"
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          echo "Deleted already merged branch: $branch"
