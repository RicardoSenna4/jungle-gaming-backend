name: cleanup-quarantine-branch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  delete-merged:
    if: github.repository == 'RicardoSenna4/jungle-gaming-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only fully integrated branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/quarantine-dlq-retry-contract"
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')"
          if [[ "${ahead}" != "0" ]]; then
            echo "::error::Refusing to delete: ${ahead} unmerged commit(s)"
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          echo "Deleted fully merged branch: ${branch}"
