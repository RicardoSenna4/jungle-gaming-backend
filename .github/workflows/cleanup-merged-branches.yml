name: cleanup-merged-branches

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'RicardoSenna4/jungle-gaming-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Remove only verified fully merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in fix/challenge-f00-f01 fix/challenge-final-remediation; do
            ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')"
            if [[ "${ahead}" != "0" ]]; then
              echo "::error::Branch ${branch} contains ${ahead} commits not in main; refusing to delete"
              exit 1
            fi
          done
          for branch in fix/challenge-f00-f01 fix/challenge-final-remediation; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted fully merged branch: ${branch}"
          done
