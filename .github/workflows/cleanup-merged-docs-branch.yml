name: cleanup-merged-docs-branch
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'RicardoSenna4/jungle-gaming-backend'
    runs-on: ubuntu-latest
    steps:
      - name: Delete branch only when fully merged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="docs/evaluator-ready-delivery"
          ahead="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${branch}" --jq '.ahead_by')"
          if [[ "${ahead}" != "0" ]]; then
            echo "::error::Unmerged commits exist, refusing deletion"
            exit 1
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          echo "Deleted branch ${branch} after validating zero unmerged commits"
