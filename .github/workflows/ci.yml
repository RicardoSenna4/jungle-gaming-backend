name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.38'
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - run: bun test

  integration-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.38'
      - run: bun install --frozen-lockfile
      - run: docker compose up -d postgres localstack
      - run: docker compose ps
      - name: Wait for PostgreSQL and LocalStack
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            postgres_ready=false
            localstack_ready=false

            if docker compose exec -T postgres pg_isready -U postgres -d jungle >/dev/null 2>&1; then
              postgres_ready=true
            fi

            if curl --fail --silent http://localhost:4566/_localstack/health | grep -q 'sqs'; then
              localstack_ready=true
            fi

            if [[ "$postgres_ready" == true && "$localstack_ready" == true ]]; then
              echo "PostgreSQL and LocalStack are ready"
              exit 0
            fi

            echo "Waiting for services (attempt ${attempt}/60): postgres=${postgres_ready}, localstack=${localstack_ready}"
            sleep 2
          done

          docker compose ps
          exit 1
      - run: bun run db:migrate
      - run: RUN_INTEGRATION=1 RUN_SQS_REAL=1 bun test test/integration/sqs-localstack.spec.ts
      - run: bun run db:rollback
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
