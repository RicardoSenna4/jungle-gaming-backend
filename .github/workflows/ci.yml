name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: quality, PostgreSQL, LocalStack and required suites
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: jungle
      DB_USER: postgres
      DB_PASSWORD: postgres
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localhost:4566
      SQS_QUEUE_URL: http://localhost:4566/000000000000/wager-transactions.fifo
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.38'
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Check formatting
        run: bun run format:check
      - name: Build
        run: bun run build
      - name: Start isolated PostgreSQL and LocalStack services
        run: docker compose up -d postgres localstack
      - name: Wait for PostgreSQL and LocalStack
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            postgres_ready=false
            localstack_ready=false

            if docker compose exec -T postgres pg_isready -U postgres -d jungle >/dev/null 2>&1; then
              postgres_ready=true
            fi

            if curl --fail --silent http://localhost:4566/_localstack/health | grep -q 'sqs'; then
              localstack_ready=true
            fi

            if [[ "$postgres_ready" == true && "$localstack_ready" == true ]]; then
              echo "PostgreSQL and LocalStack are ready"
              exit 0
            fi

            echo "Waiting for services (attempt ${attempt}/60): postgres=${postgres_ready}, localstack=${localstack_ready}"
            sleep 2
          done

          docker compose ps
          docker compose logs --no-color
          exit 1
      - name: Wait for all LocalStack queues
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if aws --endpoint-url http://localhost:4566 sqs get-queue-url \
              --queue-name wager-transactions.fifo >/dev/null 2>&1 \
              && aws --endpoint-url http://localhost:4566 sqs get-queue-url \
                --queue-name wager-transactions-dlq.fifo >/dev/null 2>&1 \
              && aws --endpoint-url http://localhost:4566 sqs get-queue-url \
                --queue-name wager-events.fifo >/dev/null 2>&1; then
              echo "LocalStack command, DLQ and event queues are ready"
              exit 0
            fi

            echo "Waiting for LocalStack queues (attempt ${attempt}/60)"
            sleep 2
          done

          docker compose logs --no-color localstack
          exit 1
      - name: Apply all migrations to the disposable database
        run: bun run db:migrate
      - name: Run every required suite (unit, PostgreSQL, concurrency, recovery and SQS)
        run: bun run test:all
      - name: Verify no migration remains pending
        run: bun run db:migration:check
      - name: Roll back the full migration chain and migrate it again
        shell: bash
        run: |
          set -euo pipefail
          migration_count="$(find src/infrastructure/database/migrations -maxdepth 1 -type f -name 'Migration*.ts' | wc -l | tr -d '[:space:]')"
          if [[ "$migration_count" -eq 0 ]]; then
            echo "No migration files found"
            exit 1
          fi

          echo "Rolling back ${migration_count} migrations one at a time on this disposable runner database"
          for ((index = 0; index < migration_count; index++)); do
            bun run db:rollback
          done

          bun run db:migrate
          bun run db:migration:check
      - name: Upload per-suite JUnit XML and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jungle-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-results/
          if-no-files-found: warn
          retention-days: 14
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
