groups:
  - name: jungle-critical
    rules:
      - alert: JungleApiUnavailable
        expr: up{job="jungle-api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations: {summary: 'API metrics unavailable; inspect connectivity and OIDC collector permissions'}
      - alert: JungleDlqBacklog
        expr: sqs_dlq_messages > 0
        for: 2m
        labels: {severity: critical}
      - alert: JungleQuarantineOpen
        expr: quarantine_messages{status="OPEN"} > 0
        for: 5m
        labels: {severity: warning}
      - alert: JungleOutboxStalled
        expr: outbox_oldest_pending_age_seconds > 120
        for: 2m
        labels: {severity: critical}
      - alert: JungleFinancialMismatch
        expr: increase(wallet_reconciliation_mismatches_total[5m]) > 0
        for: 0m
        labels: {severity: critical}
      - alert: JungleSamplerFailure
        expr: database_metrics_collection_success == 0
        for: 2m
        labels: {severity: warning}
