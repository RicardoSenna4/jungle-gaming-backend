services:
  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      ENABLE_DB_METRICS_SAMPLER: ${ENABLE_DB_METRICS_SAMPLER:-false}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: jungle
      DB_USER: postgres
      DB_PASSWORD: postgres
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions.fifo
      SQS_DLQ_QUEUE_URL: http://localstack:4566/000000000000/wager-transactions-dlq.fifo
      SQS_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/wager-events.fifo
      ENABLE_SQS_CONSUMER: 'true'
      ENABLE_OUTBOX_PUBLISHER: 'true'
      ENABLE_PENDING_REFERENCE_WORKER: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    command: ['sh', '-lc', 'bun run db:migrate && bun run start:bun']

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jungle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d jungle']
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: 1
    ports:
      - '4566:4566'
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4566/_localstack/health | grep -q "sqs"']
      interval: 5s
      timeout: 5s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    command: ['--config.file=/etc/prometheus/prometheus.yml']
  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    ports: ['127.0.0.1:3001:3000']
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-development-only}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  localstack-data:
